# ========================================
# PRODUCTION READY - Environment Variables
# ========================================

spring.config.import=optional:file:../.env[.properties]
spring.profiles.default=dev

spring.application.name=whatsapp-backend

# MongoDB (Production Ready)
spring.data.mongodb.uri=${DATABASE_URL:mongodb://localhost:27017/whatsapp}
spring.data.mongodb.database=whatsapp

# Redis (Production Ready)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DB:0}

# JWT (Production Ready)
jwt.secret=${JWT_SECRET:2b4fc1e90f0497f2dca8f4c1b6bfda130453a743b1a1c041b29983b256f4cf30}
jwt.expiration=${JWT_EXPIRATION:2592000000}

# Google OAuth (Production Ready)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Twilio (Production Ready)
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.sms.from=${TWILIO_SMS_FROM}

# Server
server.port=${SERVER_PORT:8080}

# Logging
logging.level.org.springframework=INFO
logging.level.com.starkindustries=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

#Cloudinary configurations:

cloudinary.cloud.name=${CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}
spring.servlet.multipart.enabled=true

# Frontend OAuth Callback
frontend.callback.url=${FRONTEND_CALLBACK_URL:http://localhost:3000/oauth-callback}
